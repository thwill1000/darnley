<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Sealed Room Murder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="transcript" role="log" aria-live="polite"></div>
    <button id="more" type="button" hidden>MORE</button>
    <button id="look-button" type="button" aria-label="Redescribe location" title="Redescribe location">&#x1F441;&#xFE0E;</button>
    <dialog id="restart-dialog" aria-labelledby="restart-prompt">
      <form method="dialog">
        <p id="restart-prompt">Restart the game?</p>
        <button type="submit" value="yes">YES</button>
        <button type="submit" value="no">NO</button>
      </form>
    </dialog>
    <div id="input-line">
      <span id="prompt"></span>
      <input id="command-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="send" spellcheck="false" disabled>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
