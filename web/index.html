<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Sealed Room Murder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="transcript" role="log" aria-live="polite"></div>
    <button id="more" type="button" hidden>MORE</button>
    <div id="input-line">
      <span id="prompt"></span>
      <input id="command-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="send" spellcheck="false" disabled>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
