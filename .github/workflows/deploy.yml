name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Grant permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral version file
        run: |
          # Pull base version from package.json
          VERSION=$(node -p "require('./web/package.json').version")

          # Use GitHub's sequential run number (rebase-safe!)
          BUILD_NUMBER="${{ github.run_number }}"

          # Write it directly into web/version.js for this deployment only
          cat << EOF > web/src/version.js
          export const APP_VERSION = "$VERSION-build.$BUILD_NUMBER";
          EOF

      - name: Replace symlink with real directory content
        run: |
          rm -rf web/data
          cp -r mmbasic/data web/data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
